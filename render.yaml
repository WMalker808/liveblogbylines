services:
  - type: web
    name: liveblog-bylines-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    plan: free

    envVars:
      - key: GUARDIAN_API_KEY
        sync: false          # value is set manually in the Render dashboard
      - key: PYTHON_VERSION
        value: "3.12.0"
