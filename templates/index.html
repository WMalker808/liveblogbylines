<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardian Live Blog Bylines Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: -0.5px; }
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .stat-value { font-size: 2.2rem; font-weight: 700; line-height: 1; }
    .stat-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; }
    #chart-container { position: relative; height: 300px; }
    .table th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: .04em; color: #6c757d; border-top: none; }
    .blog-title a { color: #1a1a1a; text-decoration: none; }
    .blog-title a:hover { text-decoration: underline; }
    .badge-byline { background: #052962; }
    #spinner { display: none; }
    .error-box { display: none; }
    .progress-bar-custom { height: 6px; border-radius: 3px; background: #052962; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark" style="background:#052962;">
    <div class="container">
      <span class="navbar-brand">Live Blog Bylines Dashboard</span>
      <span class="text-white-50 small">Guardian CAPI</span>
    </div>
  </nav>

  <div class="container py-4">

    <!-- Controls -->
    <div class="card mb-4">
      <div class="card-body">
        <form id="fetch-form" class="row g-3 align-items-end">
          <div class="col-md-3">
            <label class="form-label fw-semibold">From date</label>
            <input type="date" class="form-control" id="from-date" value="{{ default_from }}" required>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">To date</label>
            <input type="date" class="form-control" id="to-date" value="{{ default_to }}" required>
          </div>
          <div class="col-md-4">
            <button type="submit" class="btn btn-primary w-100" style="background:#052962;border-color:#052962;">
              <span id="spinner" class="spinner-border spinner-border-sm me-1" role="status"></span>
              Fetch data
            </button>
          </div>
        </form>
        <div id="error-box" class="alert alert-danger mt-3 mb-0 error-box"></div>
      </div>
    </div>

    <!-- Summary stats -->
    <div class="row g-3 mb-4" id="stats-row" style="display:none!important;">
      <div class="col-6 col-md">
        <div class="card text-center p-3">
          <div class="stat-value text-primary" id="stat-bylined-blocks">–</div>
          <div class="stat-label mt-1">Block-level bylines</div>
        </div>
      </div>
      <div class="col-6 col-md">
        <div class="card text-center p-3">
          <div class="stat-value" id="stat-blogs">–</div>
          <div class="stat-label mt-1">Live blogs fetched</div>
        </div>
      </div>
      <div class="col-6 col-md">
        <div class="card text-center p-3">
          <div class="stat-value" id="stat-blogs-with-bylines">–</div>
          <div class="stat-label mt-1">Blogs with bylines</div>
        </div>
      </div>
      <div class="col-6 col-md">
        <div class="card text-center p-3">
          <div class="stat-value" id="stat-avg-blog">–</div>
          <div class="stat-label mt-1">Avg bylines / blog</div>
        </div>
      </div>
      <div class="col-6 col-md">
        <div class="card text-center p-3">
          <div class="stat-value text-success" id="stat-avg-day">–</div>
          <div class="stat-label mt-1">Avg bylines / day</div>
        </div>
      </div>
    </div>

    <!-- Chart -->
    <div class="card mb-4" id="chart-card" style="display:none;">
      <div class="card-body">
        <h6 class="card-title fw-semibold mb-3">Block-level bylines per day</h6>
        <div id="chart-container">
          <canvas id="daily-chart"></canvas>
        </div>
      </div>
    </div>

    <!-- Per-blog table -->
    <div class="card" id="table-card" style="display:none;">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="card-title fw-semibold mb-0">Bylines per live blog</h6>
          <input type="search" class="form-control form-control-sm w-auto" id="table-search"
                 placeholder="Filter blogs…" style="min-width:200px;">
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="blog-table">
            <thead>
              <tr>
                <th style="width:50%">Blog</th>
                <th>Date</th>
                <th class="text-end">Total blocks</th>
                <th class="text-end">Bylined blocks</th>
                <th style="width:120px">Coverage</th>
              </tr>
            </thead>
            <tbody id="blog-tbody"></tbody>
          </table>
        </div>
        <div id="no-results" class="text-center text-muted py-3" style="display:none;">No matching blogs.</div>
      </div>
    </div>

  </div><!-- /container -->

  <script>
    let chartInstance = null;
    let allBlogRows = [];

    document.getElementById('fetch-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetchData();
    });

    document.getElementById('table-search').addEventListener('input', filterTable);

    async function fetchData() {
      const fromDate = document.getElementById('from-date').value;
      const toDate   = document.getElementById('to-date').value;

      setError('');
      setLoading(true);
      hideResults();

      try {
        const resp = await fetch('/fetch', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({from_date: fromDate, to_date: toDate})
        });
        const data = await resp.json();

        if (!data.success) {
          setError(data.error || 'An unknown error occurred.');
          return;
        }

        renderStats(data);
        renderChart(data.daily_labels, data.daily_values);
        renderTable(data.blogs);
        showResults();

      } catch (err) {
        setError('Network error: ' + err.message);
      } finally {
        setLoading(false);
      }
    }

    function renderStats(data) {
      const blogsWithBylines = data.blogs.filter(b => b.bylined_block_count > 0).length;

      const avgPerBlog = data.total_blogs_fetched > 0
        ? (data.total_bylined_blocks / data.total_blogs_fetched).toFixed(1)
        : '0';

      const fromDate = new Date(document.getElementById('from-date').value);
      const toDate   = new Date(document.getElementById('to-date').value);
      const days = Math.max(1, Math.round((toDate - fromDate) / 86400000) + 1);
      const avgPerDay = (data.total_bylined_blocks / days).toFixed(1);

      document.getElementById('stat-bylined-blocks').textContent = data.total_bylined_blocks.toLocaleString();
      document.getElementById('stat-blogs').textContent = data.total_blogs_fetched.toLocaleString();
      document.getElementById('stat-blogs-with-bylines').textContent = blogsWithBylines.toLocaleString();
      document.getElementById('stat-avg-blog').textContent = avgPerBlog;
      document.getElementById('stat-avg-day').textContent = avgPerDay;
    }

    function renderChart(labels, values) {
      if (chartInstance) {
        chartInstance.destroy();
        chartInstance = null;
      }

      if (!labels.length) return;

      const ctx = document.getElementById('daily-chart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: 'Block-level bylines',
            data: values,
            backgroundColor: '#052962cc',
            borderColor: '#052962',
            borderWidth: 1,
            borderRadius: 3,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: (items) => items[0].label,
                label: (item) => ` ${item.raw} bylined block${item.raw !== 1 ? 's' : ''}`
              }
            }
          },
          scales: {
            x: { grid: { display: false } },
            y: {
              beginAtZero: true,
              ticks: { precision: 0 },
              title: { display: true, text: 'Bylined blocks' }
            }
          }
        }
      });
    }

    function renderTable(blogs) {
      allBlogRows = blogs;
      document.getElementById('table-search').value = '';
      renderTableRows(blogs);
    }

    function renderTableRows(blogs) {
      const tbody = document.getElementById('blog-tbody');
      tbody.innerHTML = '';

      if (!blogs.length) {
        document.getElementById('no-results').style.display = '';
        return;
      }
      document.getElementById('no-results').style.display = 'none';

      const maxBylines = Math.max(...blogs.map(b => b.bylined_block_count), 1);

      blogs.forEach(blog => {
        const pct = blog.total_blocks > 0
          ? Math.round(100 * blog.bylined_block_count / blog.total_blocks)
          : 0;
        const barWidth = Math.round(100 * blog.bylined_block_count / maxBylines);

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="blog-title">
            <a href="https://www.theguardian.com/${blog.id}" target="_blank" rel="noopener">
              ${escapeHtml(blog.title)}
            </a>
          </td>
          <td class="text-nowrap text-muted small">${blog.date}</td>
          <td class="text-end">${blog.total_blocks}</td>
          <td class="text-end">
            ${blog.bylined_block_count > 0
              ? `<span class="badge rounded-pill badge-byline">${blog.bylined_block_count}</span>`
              : '<span class="text-muted">0</span>'}
          </td>
          <td>
            <div class="d-flex align-items-center gap-2">
              <div class="flex-grow-1 bg-light rounded" style="height:6px;">
                <div class="progress-bar-custom" style="width:${barWidth}%;"></div>
              </div>
              <span class="small text-muted" style="min-width:2.5rem;">${pct}%</span>
            </div>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    function filterTable() {
      const q = document.getElementById('table-search').value.toLowerCase();
      const filtered = q
        ? allBlogRows.filter(b => b.title.toLowerCase().includes(q))
        : allBlogRows;
      renderTableRows(filtered);
    }

    function setLoading(on) {
      document.getElementById('spinner').style.display = on ? 'inline-block' : 'none';
    }

    function setError(msg) {
      const box = document.getElementById('error-box');
      box.style.display = msg ? '' : 'none';
      box.textContent = msg;
    }

    function showResults() {
      document.getElementById('stats-row').style.removeProperty('display');
      document.getElementById('chart-card').style.display = '';
      document.getElementById('table-card').style.display = '';
    }

    function hideResults() {
      document.getElementById('stats-row').style.setProperty('display', 'none', 'important');
      document.getElementById('chart-card').style.display = 'none';
      document.getElementById('table-card').style.display = 'none';
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
